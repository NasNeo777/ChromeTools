<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek 工具箱</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="hero">
    <div class="eyebrow">DEEPSEEK / LEARNING TOOLS</div><h1>视频学习工具箱</h1>
    <p>看懂视频，再用练习检验理解。</p>
  </div>

  <div class="section">
    <!-- 共享配置 -->
    <div class="card">
      <div class="global-title">连接你的 AI</div>
      <label for="apiKey">DeepSeek API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
      <div class="hint">
        在 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer">platform.deepseek.com</a> 获取，仅保存在本地浏览器。
      </div>
      <label for="model">模型</label>
      <select id="model">
        <option value="deepseek-chat">deepseek-chat（推荐，快）</option>
        <option value="deepseek-reasoner">deepseek-reasoner（更强，慢）</option>
      </select>
    </div>

    <!-- 工具卡片（由 popup.js 动态渲染） -->
    <div id="tool-list"></div>

    <button class="save" id="save">保存设置</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <script src="tools.js"></script>
  <script src="popup.js"></script>
</body>
</html>
